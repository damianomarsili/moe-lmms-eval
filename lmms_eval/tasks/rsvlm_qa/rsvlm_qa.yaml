dataset_path: dmarsili/RSVLM-QA-2k
dataset_kwargs:
  token: true
task: "rsvlm_qa"
test_split: validation
output_type: generate_until
doc_to_visual: !function utils.rsvlm_qa_doc_to_visual
doc_to_text: !function utils.rsvlm_qa_doc_to_text
doc_to_target: "answer"
process_results: !function utils.rsvlm_qa_process_results

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer in natural language."

generation_kwargs:
  max_new_tokens: 2048
  temperature: 0
  do_sample: false

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true

metadata:
  - version: 0.0

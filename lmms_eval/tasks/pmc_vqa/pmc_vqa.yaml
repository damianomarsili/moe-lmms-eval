dataset_path: RadGenome/PMC-VQA
dataset_kwargs:
  token: true
  custom_dataset: !function utils.pmc_vqa_load_dataset
task: "pmc_vqa"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.pmc_vqa_doc_to_visual
doc_to_text: !function utils.pmc_vqa_doc_to_text
doc_to_target: "Answer_label"
process_results: !function utils.pmc_vqa_process_results

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option letter only (A, B, C, or D)."

generation_kwargs:
  max_new_tokens: 2048
  temperature: 0
  do_sample: false

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true

metadata:
  - version: 0.0
